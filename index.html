<!DOCTYPE html>
<html lang="zh-CN">

<style>

  .btn-primary{

  .progress-meta{display:flex;justify-content:space-between;font-size:12.5px;color:#8a917f;margin-bottom:8px;letter-spacing:.04em}

  .match-card::before{

  }
  .match-card.second{opacity:.94;--c:#b8873f}
  .match-badge{

  .dim-head span{color:#9aa392;font-size:12px}

</style>
</head>

      {t:'拼。别人不愿意做的事我做了，别人吃不了的苦我吃了', v:[2,1,2,1,1]},

/* =========================================================
   状态
   ========================================================= */
let current = 0;
const answers = new Array(QUESTIONS.length).fill(null);

const el = id => document.getElementById(id);
const screenIntro = el('screen-intro');
const screenQuiz  = el('screen-quiz');
const screenResult= el('screen-result');
const questionArea= el('questionArea');
const prevBtn     = el('prevBtn');

/* =========================================================
   工具函数
   ========================================================= */
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const toPct = v => Math.round((clamp(v,-2,2) + 2) / 4 * 100);

function hexA(hex, a){
  const h = hex.replace('#','');
  return `rgba(${parseInt(h.substr(0,2),16)},${parseInt(h.substr(2,2),16)},${parseInt(h.substr(4,2),16)},${a})`;
}

function distance(a,b){
  let s = 0;
  for(let i=0;i<a.length;i++) s += (a[i]-b[i])*(a[i]-b[i]);
  return Math.sqrt(s);
}

function baikeLink(name){
  return 'https://baike.baidu.com/search/word?word=' + encodeURIComponent('兰香如故 ' + name);
}

/* =========================================================
   答题流程
   ========================================================= */
el('startBtn').addEventListener('click', () => {
  screenIntro.classList.add('hidden');
  screenQuiz.classList.remove('hidden');
  current = 0;
  renderQuestion();
});

prevBtn.addEventListener('click', () => {
  if(current > 0){ current--; renderQuestion(); }
});

questionArea.addEventListener('click', e => {
  const btn = e.target.closest('.option');
  if(!btn) return;
  const idx = parseInt(btn.dataset.i, 10);
  if(isNaN(idx)) return;

  answers[current] = idx;

  // 视觉反馈
  questionArea.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
  btn.classList.add('selected');

  setTimeout(() => {
    if(current < QUESTIONS.length - 1){
      current++;
      renderQuestion();
    }else{
      showResult();
    }
  }, 200);
});

function renderQuestion(){
  const q = QUESTIONS[current];
  const total = QUESTIONS.length;

  el('qIndex').textContent = `第 ${current+1} / ${total} 题`;
  const pct = Math.round((current) / total * 100);
  el('qPercent').textContent = pct + '%';
  el('progressFill').style.width = ((current) / total * 100) + '%';

  prevBtn.disabled = current === 0;
  prevBtn.textContent = current === 0 ? '这是第一题' : '← 上一题';

  const chosen = answers[current];

  questionArea.innerHTML =
    `<h2 class="q-title">${q.q}</h2>` +
    `<div class="options">` +
    q.o.map((opt, i) =>
      `<button class="option${chosen===i?' selected':''}" data-i="${i}" type="button">
         <span class="opt-key">${'ABCD'[i]}</span>
         <span class="opt-text">${opt.t}</span>
       </button>`
    ).join('') +
    `</div>`;

  // 重启动画
  questionArea.classList.remove('anim');
  void questionArea.offsetWidth;
  questionArea.classList.add('anim');

  window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});
}

/* =========================================================
   计分
   ========================================================= */
function computeUserVector(){
  const sum = [0,0,0,0,0];
  answers.forEach((optIdx, qi) => {
    const v = QUESTIONS[qi].o[optIdx].v;
    for(let i=0;i<5;i++) sum[i] += v[i];
  });
  return sum.map(s => s / QUESTIONS.length);
}

function computeMatches(userVec){
  const list = ROLES.map(role => {
    const d = distance(userVec, role.vector);
    const score = Math.min(97, Math.round(100 * Math.pow(0.90, d)));
    return { role, d, score };
  });
  list.sort((a,b) => a.d - b.d);
  return list;
}

/* =========================================================
   匹配理由生成
   ========================================================= */
function buildReasons(userVec, role, count){
  const pairs = DIMS.map((d,i) => ({ d, i, u:userVec[i], r:role.vector[i] }));
  const byClose = [...pairs].sort((a,b) => Math.abs(a.u-a.r) - Math.abs(b.u-b.r));
  const byHigh  = [...pairs].sort((a,b) => b.u - a.u);

  const out = [];
  const used = new Set();

  // 1. 用户最高维度
  const top = byHigh[0];
  out.push(`你在「${top.d}」一项上得分最高（${toPct(top.u)} 分），这也是${role.name}最鲜明的底色——${role.dims[top.d]}。`);
  used.add(top.d);

  // 2. 与角色最接近的维度
  for(const p of byClose){
    if(used.has(p.d)) continue;
    out.push(`你的「${p.d}」拿到 ${toPct(p.u)} 分，与${role.name}的基准（${toPct(p.r)} 分）几乎重合：${role.dims[p.d]}。`);
    used.add(p.d);
    break;
  }

  // 3. 次高维度
  const top2 = byHigh.find(p => !used.has(p.d));
  if(top2){
    out.push(`「${top2.d}」同样是你的强项（${toPct(top2.u)} 分），对应${role.name}身上的另一点：${role.dims[top2.d]}。`);
    used.add(top2.d);
  }

  // 4. 差异说明
  const far = byClose[byClose.length - 1];
  if(far && Math.abs(far.u - far.r) > 0.35){
    if(far.u < far.r){
      out.push(`有一点要说清楚：${role.name}在「${far.d}」上比你走得更远（角色 ${toPct(far.r)} 分 / 你 ${toPct(far.u)} 分）——${role.dims[far.d]}；而你在这一点上，给自己留了更多余地。`);
    }else{
      out.push(`有意思的是，你在「${far.d}」上甚至超过了${role.name}的基准（你 ${toPct(far.u)} 分 / 角色 ${toPct(far.r)} 分）——${role.dims[far.d]}，这一点你比 TA 走得更远。`);
    }
  }

  return out.slice(0, count);
}

/* =========================================================
   结果渲染
   ========================================================= */
let resultData = null;

function showResult(){
  const userVec = computeUserVector();
  const matches = computeMatches(userVec);
  const first = matches[0];
  const second = matches[1];

  resultData = { userVec, first, second };

  const firstReasons  = buildReasons(userVec, first.role, 4);
  const secondReasons = buildReasons(userVec, second.role, 2);

  const dimRows = DIMS.map((d,i) => {
    const u = toPct(userVec[i]);
    const r = toPct(first.role.vector[i]);
    return `<li>
      <div class="dim-head"><b>${d}</b><span>你 ${u} · ${first.role.name} ${r}</span></div>
      <div class="dim-track">
        <i class="r" style="width:${r}%"></i>
        <i class="u" style="width:${u}%"></i>
      </div>
    </li>`;
  }).join('');

  el('resultArea').innerHTML = `
    <div class="result-head">
      <p class="result-kicker">你 的 测 试 结 果</p>
      <h1 class="result-title serif">你是<em>${first.role.name}</em></h1>
    </div>

    <div class="match-card first" style="--c:${first.role.color}">
      <div class="match-badge">第一匹配</div>
      <div class="match-name serif">${first.role.name}</div>
      <div class="match-actor">${first.role.actor} 饰</div>
      <p class="match-tagline">${first.role.tagline}</p>
      <div class="match-score"><span class="score-num">${first.score}</span><span class="score-unit">%</span></div>
      <div class="match-bar"><i style="width:0" data-w="${first.score}"></i></div>
    </div>

    <div class="match-card second" style="--c:${second.role.color}">
      <div class="match-badge">第二匹配</div>
      <div class="match-name serif">${second.role.name}</div>
      <div class="match-actor">${second.role.actor} 饰</div>
      <p class="match-tagline">${second.role.tagline}</p>
      <div class="match-score"><span class="score-num">${second.score}</span><span class="score-unit">%</span></div>
      <div class="match-bar"><i style="width:0" data-w="${second.score}"></i></div>
    </div>

    <div class="panel">
      <h2 class="panel-title">五维画像</h2>
      <div class="radar-wrap"><canvas id="radarCanvas"></canvas></div>
      <div class="radar-legend">
        <span><i class="dot user"></i>你</span>
        <span><i class="dot role"></i>${first.role.name}基准</span>
      </div>
      <ul class="dim-list">${dimRows}</ul>
    </div>

    <div class="panel">
      <h2 class="panel-title">为什么是 ${first.role.name}</h2>
      <ol class="reason-list">
        ${firstReasons.map(r => `<li>${r}</li>`).join('')}
      </ol>
    </div>

    <div class="panel">
      <h2 class="panel-title">你身上的 ${second.role.name}</h2>
      <ol class="reason-list">
        ${secondReasons.map(r => `<li>${r}</li>`).join('')}
      </ol>
    </div>

    <div class="panel">
      <h2 class="panel-title">人物资料</h2>
      <a class="link-item" href="${baikeLink(first.role.name)}" target="_blank" rel="noopener noreferrer">
        ${first.role.name} · 百度百科 <span>↗</span>
      </a>
      <a class="link-item" href="${baikeLink(second.role.name)}" target="_blank" rel="noopener noreferrer">
        ${second.role.name} · 百度百科 <span>↗</span>
      </a>
      <a class="link-item" href="${baikeLink('')}" target="_blank" rel="noopener noreferrer">
        《兰香如故》剧集 · 百度百科 <span>↗</span>
      </a>
    </div>

    <p class="disclaimer">
      本测试仅供娱乐参考，结果不构成心理学专业判断。<br>
      所有计算均在你的设备本地完成，不收集、不上传任何答题数据。
    </p>

    <button class="btn-retry" id="retryBtn">重新测试</button>
  `;

  screenQuiz.classList.add('hidden');
  screenResult.classList.remove('hidden');
  window.scrollTo(0,0);

  // 进度条动画
  requestAnimationFrame(() => {
    document.querySelectorAll('.match-bar i').forEach(bar => {
      bar.style.width = bar.dataset.w + '%';
    });
  });

  // 绘制雷达图
  requestAnimationFrame(() => {
    const canvas = el('radarCanvas');
    if(canvas) drawRadar(canvas, userVec, first.role.vector, first.role.color);
  });

  el('retryBtn').addEventListener('click', resetAll);
}

function resetAll(){
  answers.fill(null);
  current = 0;
  resultData = null;
  screenResult.classList.add('hidden');
  screenIntro.classList.remove('hidden');
  window.scrollTo(0,0);
}

/* =========================================================
   雷达图（原生 Canvas，无第三方库）
   ========================================================= */
function drawRadar(canvas, userVec, roleVec, roleColor){
  const dpr = window.devicePixelRatio || 1;
  const cssW = canvas.parentElement.clientWidth || 300;
  const cssH = Math.max(280, Math.min(cssW, 340));

  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  canvas.width = Math.round(cssW * dpr);
  canvas.height = Math.round(cssH * dpr);

  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,cssW,cssH);

  const cx = cssW / 2;
  const cy = cssH / 2;
  const R = Math.min(cssW, cssH) * 0.30;
  const n = DIMS.length;
  const angle = i => -Math.PI/2 + i * 2 * Math.PI / n;
  const norm = v => (clamp(v,-2,2) + 2) / 4;

  // 网格
  for(let lv=1; lv<=4; lv++){
    const r = R * lv / 4;
    ctx.beginPath();
    for(let i=0;i<n;i++){
      const a = angle(i);
      const x = cx + Math.cos(a)*r, y = cy + Math.sin(a)*r;
      i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y);
    }
    ctx.closePath();
    ctx.strokeStyle = 'rgba(90,107,82,0.14)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // 轴线
  for(let i=0;i<n;i++){
    const a = angle(i);
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(a)*R, cy + Math.sin(a)*R);
    ctx.strokeStyle = 'rgba(90,107,82,0.14)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  const pts = vec => vec.map((v,i) => {
    const a = angle(i);
    const r = R * norm(v);
    return [cx + Math.cos(a)*r, cy + Math.sin(a)*r];
  });

  // 角色多边形
  const rolePts = pts(roleVec);
  ctx.beginPath();
  rolePts.forEach(([x,y],i) => i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y));
  ctx.closePath();
  ctx.fillStyle = hexA(roleColor, 0.14);
  ctx.fill();
  ctx.setLineDash([4,3]);
  ctx.strokeStyle = hexA(roleColor, 0.65);
  ctx.lineWidth = 1.5;
  ctx.stroke();
  ctx.setLineDash([]);

  // 用户多边形
  const userPts = pts(userVec);
  ctx.beginPath();
  userPts.forEach(([x,y],i) => i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y));
  ctx.closePath();
  ctx.fillStyle = 'rgba(168,68,58,0.18)';
  ctx.fill();
  ctx.strokeStyle = '#a8443a';
  ctx.lineWidth = 2;
  ctx.stroke();

  // 用户顶点
  userPts.forEach(([x,y]) => {
    ctx.beginPath();
    ctx.arc(x, y, 3.2, 0, Math.PI*2);
    ctx.fillStyle = '#a8443a';
    ctx.fill();
  });

  // 标签
  const fontMain = '12px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  const fontNum  = '11px -apple-system,"PingFang SC",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  for(let i=0;i<n;i++){
    const a = angle(i);
    const lx = cx + Math.cos(a) * (R + 24);
    const ly = cy + Math.sin(a) * (R + 24);

    ctx.font = fontMain;
    ctx.fillStyle = '#4a5648';
    ctx.fillText(DIMS[i], lx, ly);

    ctx.font = fontNum;
    ctx.fillStyle = '#a8443a';
    ctx.fillText(toPct(userVec[i]), lx, ly + 14);
  }
}

/* 屏幕旋转 / 尺寸变化时重绘 */
let resizeTimer = null;
window.addEventListener('resize', () => {
  if(!resultData) return;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const canvas = el('radarCanvas');
    if(canvas) drawRadar(canvas, resultData.userVec, resultData.first.role.vector, resultData.first.role.color);
  }, 180);
});
</script>
